.step-inside-transition {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:

    linear-gradient(180deg, rgba(253,251,247,0.12) 0%, rgba(245,237,228,0.42) 100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity 3.2s ease,
    visibility 3.2s ease;
}

.step-inside-transition.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.step-inside-transition::before,
.step-inside-transition::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(90vw, 520px);
  height: min(90vw, 520px);
  border-radius: 999px;
  background:
    radial-gradient(circle, rgba(255,255,255,0.72) 0%, rgba(245,237,228,0.38) 38%, rgba(232,221,211,0) 72%);
  filter: blur(34px);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.68);
}

.step-inside-transition.active::before {
  animation: stepCloudOpen 4.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.step-inside-transition.active::after {

  <script>
        // Fade-in on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.15 });
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

        // Step inside transition to CalmNow
        const stepInsideBtn = document.getElementById('stepInsideBtn');
        const stepInsideTransition = document.getElementById('stepInsideTransition');

        if (stepInsideBtn && stepInsideTransition) {
          stepInsideBtn.addEventListener('click', (e) => {
            e.preventDefault();

            window.calmTrack?.('Step Inside Clicked');

            stepInsideTransition.classList.add('active');
            stepInsideTransition.setAttribute('aria-hidden', 'false');
            document.body.classList.add('entering-calmnow');

            window.setTimeout(() => {
              window.location.href = stepInsideBtn.href || 'https://calmnow.club';
            }, 5500);
          });
        }


        // Infinite circular carousel
        const cards = document.querySelectorAll('.feature-card');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const dots = document.querySelectorAll('.dot');
        let currentIndex = 0;
        const totalCards = 3;

        function updateCarousel() {
          cards.forEach((card, i) => {
            card.classList.remove('prev', 'active', 'next');
            
            const relativeIndex = (i - currentIndex + totalCards) % totalCards;
            
            if (relativeIndex === 0) {
              card.classList.add('active');
            } else if (relativeIndex === 1) {
              card.classList.add('next');
            } else {
              card.classList.add('prev');
            }
          });
          
          dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === currentIndex);
          });
        }

        prevBtn.addEventListener('click', () => {
          currentIndex = (currentIndex - 1 + totalCards) % totalCards;
          updateCarousel();
        });

        nextBtn.addEventListener('click', () => {
          currentIndex = (currentIndex + 1) % totalCards;
          updateCarousel();
        });

        dots.forEach((dot, i) => {
          dot.addEventListener('click', () => {
            currentIndex = i;
            updateCarousel();
          });
        });


        // Reflection card video modal
        const videoModal = document.getElementById('videoModal');
        const demoVideo = document.getElementById('demoVideo');
        const closeVideoModal = document.getElementById('closeVideoModal');

        function openVideoModal() {
          if (!videoModal || !demoVideo) return;

          videoModal.classList.add('active');
          videoModal.setAttribute('aria-hidden', 'false');

          demoVideo.currentTime = 0;
          const playPromise = demoVideo.play();

          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {
              // Some browsers require the user to tap play manually.
            });
          }
        }

        function closeVideo() {
          if (!videoModal || !demoVideo) return;

          demoVideo.pause();
          videoModal.classList.remove('active');
          videoModal.setAttribute('aria-hidden', 'true');
        }

       cards.forEach((card) => {
  card.addEventListener('click', () => {

    const demoType = card.dataset.demo;

   if (demoType === 'reflection') {
  demoVideo.src =
    'https://foizrwegmdnekaxsahxu.supabase.co/storage/v1/object/public/sound-images/clip_landing%20page_1.mp4';
}

else if (demoType === 'pause') {
  demoVideo.src =
    'https://foizrwegmdnekaxsahxu.supabase.co/storage/v1/object/public/sound-images/vdo_pause.mp4';
}

else if (demoType === 'calmy') {
  demoVideo.src =
    'https://foizrwegmdnekaxsahxu.supabase.co/storage/v1/object/public/sound-images/Card.mp4';
}

else {
  return;
}

    openVideoModal();

  });
});

        if (closeVideoModal) {
          closeVideoModal.addEventListener('click', closeVideo);
        }

        if (videoModal) {
          videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal || e.target.classList.contains('video-backdrop')) {
              closeVideo();
            }
          });
        }

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            closeVideo();
          }
        });

        // Mobile swipe support
        let touchStartX = 0;
        let touchEndX = 0;
        const carouselEl = document.getElementById('card-carousel');

        carouselEl.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, false);

        carouselEl.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          const diff = touchStartX - touchEndX;
          
          if (Math.abs(diff) > 50) {
            if (diff > 0) {
              currentIndex = (currentIndex + 1) % totalCards;
            } else {
              currentIndex = (currentIndex - 1 + totalCards) % totalCards;
            }
            updateCarousel();
          }
        }, false);

        // Initialize
        updateCarousel();

        lucide.createIcons();
    </script>
</body>
