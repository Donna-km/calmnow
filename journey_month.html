<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Jost', sans-serif; }
    h1, h2, h3 { font-family: 'Cormorant Garamond', serif; }
    .month-pill { transition: all 0.2s ease; }
    .month-pill.active { background: #8b7355; color: #faf6f0; }
    .strip-wrapper { overflow: hidden; width: 100%; }
    .page-strip {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      align-items: center;
    }
    .page-card {
      flex-shrink: 0;
      width: 85%;
      max-width: 420px;
      margin: 0 8px;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      transform: scale(0.82);
      opacity: 0.45;
      border-radius: 1.25rem;
      background: #fffcf8;
      padding: 2.5rem 2rem;
      min-height: 420px;
      box-shadow: 0 2px 12px rgba(140,115,80,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .page-card.active {
      transform: scale(1);
      opacity: 1;
      box-shadow: 0 8px 32px rgba(140,115,80,0.13);
    }
    .note-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f0e8df;
    }
    .note-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: #8b7355;
      transition: opacity 0.2s ease;
    }
    .note-trigger:hover {
      opacity: 0.7;
    }
    .note-form {
      margin-top: 1rem;
      display: none;
    }
    .note-form.visible {
      display: block;
    }
    .note-input {
      width: 100%;
      min-height: 60px;
      padding: 0.75rem;
      border: 1px solid #e0d8cc;
      border-radius: 0.5rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.875rem;
      color: #6b5a45;
      background: #fefbf7;
      resize: none;
      margin-bottom: 0.75rem;
    }
    .note-input::placeholder {
      color: #b8a990;
    }
    .note-input:focus {
      outline: none;
      border-color: #8b7355;
      background: #fffcf8;
    }
    .note-save-btn {
      padding: 0.5rem 1rem;
      background: #8b7355;
      color: #faf6f0;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .note-save-btn:hover {
      background: #6b5442;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root" class="min-h-screen flex flex-col items-center px-4 py-10">
  <header class="text-center mb-6">
   <h1 data-template-id="page-title" class="canva-text text-4xl font-semibold" style="color:#5c4a32;">Journey</h1>
   <p data-template-id="page-subtitle" class="canva-text mt-2 text-lg" style="color:#9c8b74;">A soft record of what your heart has been learning</p>
  </header>
  <nav id="month-nav" class="flex items-center justify-center gap-3 mb-6"><button id="prev-month-btn" data-template-id="prev-month-button" class="canva-button px-3 py-2 rounded-full text-sm" style="background:#f5efe7;color:#8b7355;">←</button> <span id="month-display" class="text-lg font-semibold min-w-32 text-center" style="color:#5c4a32;"></span> <button id="next-month-btn" data-template-id="next-month-button" class="canva-button px-3 py-2 rounded-full text-sm" style="background:#f5efe7;color:#8b7355;">→</button>
  </nav>
  <main class="w-full max-w-2xl flex flex-col items-center">
   <div class="strip-wrapper" id="strip-wrapper">
    <div class="page-strip" id="page-strip"></div>
   </div>
   <div class="flex items-center gap-4 mt-6">
    <button id="prev-btn" data-template-id="prev-button" class="canva-button px-4 py-2 rounded-full text-sm" style="background:#f5efe7;color:#8b7355;">← Prev</button> <span id="page-indicator" class="text-xs" style="color:#b8a990;"></span> <button id="next-btn" data-template-id="next-button" class="canva-button px-4 py-2 rounded-full text-sm" style="background:#f5efe7;color:#8b7355;">Next →</button>
   </div>
  </main>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const journalData = {
      4: [
        { date: 'May 1', text: 'Today I noticed how the morning light fell gently across the table. It reminded me that beauty exists in the quiet, unasked-for moments.', closing: 'Let stillness speak.' },
        { date: 'May 5', text: 'I spent the afternoon reading old letters. Each word carried a version of me I had almost forgotten — tender, hopeful, unguarded.', closing: 'You are still that person.' },
        { date: 'May 12', text: 'A long walk with no destination. The trees were so green it almost hurt. I thought about how growth happens invisibly, day by day.', closing: 'Trust the slow work.' },
        { date: 'May 18', text: 'I made tea and sat with my thoughts. Not to fix anything, just to be present with what is. That felt like enough.', closing: 'Enough is enough.' },
        { date: 'May 25', text: 'Someone said something kind today, unexpectedly. I carried it with me like a small lantern the rest of the evening.', closing: 'Kindness echoes.' }
      ],
      3: [
        { date: 'Apr 3', text: 'Rain all morning. I watched it from the window and felt strangely held by the grey sky, as if the world was asking nothing of me.', closing: 'Rest is permission.' },
        { date: 'Apr 14', text: 'I planted seeds today. Such a small act of faith — believing in something I cannot yet see.', closing: 'Begin anyway.' },
        { date: 'Apr 22', text: 'A conversation that surprised me with its depth. We spoke about longing, about the spaces between words.', closing: 'Connection heals.' }
      ]
    };

    let selectedMonth = 4;
    let currentPage = 0;

    function formatDate(dateStr) {
      const parts = dateStr.split(' ');
      const monthStr = parts[0];
      const day = parts[1];
      const monthIndex = months.indexOf(monthStr);
      const date = new Date(2026, monthIndex, parseInt(day));
      const monthName = date.toLocaleString('en-US', { month: 'long' });
      return `${date.getDate()} ${monthName} ${date.getFullYear()}`;
    }

    function getPages() {
      const entries = journalData[selectedMonth] || [];
      const pages = [{ type: 'cover', month: months[selectedMonth], count: entries.length }];
      entries.forEach(e => pages.push({ type: 'entry', ...e }));
      return pages;
    }

    function updateMonthDisplay() {
      document.getElementById('month-display').textContent = months[selectedMonth];
      const hasPrev = selectedMonth > 0;
      const hasNext = selectedMonth < months.length - 1;
      document.getElementById('prev-month-btn').style.opacity = hasPrev ? '1' : '0.4';
      document.getElementById('prev-month-btn').style.pointerEvents = hasPrev ? 'auto' : 'none';
      document.getElementById('next-month-btn').style.opacity = hasNext ? '1' : '0.4';
      document.getElementById('next-month-btn').style.pointerEvents = hasNext ? 'auto' : 'none';
    }

    function changeMonth(delta) {
      const newMonth = selectedMonth + delta;
      if (newMonth < 0 || newMonth >= months.length) return;
      selectedMonth = newMonth;
      currentPage = 0;
      renderStrip();
      updateMonthDisplay();
    }

    function renderStrip() {
      const pages = getPages();
      const strip = document.getElementById('page-strip');
      strip.innerHTML = '';

      pages.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'page-card' + (i === currentPage ? ' active' : '');
        if (p.type === 'cover') {
          card.innerHTML = `
            <div class="text-center py-8 flex-1 flex flex-col justify-center">
              <h2 class="text-3xl font-semibold" style="color:#5c4a32;">${p.month}</h2>
              <p class="mt-3 text-sm" style="color:#9c8b74;">${p.count} reflection${p.count !== 1 ? 's' : ''} this month</p>
              <p class="mt-6 italic text-sm" style="color:#8b7355;">Swipe or use buttons to begin</p>
            </div>`;
        } else {
          const entryId = `${selectedMonth}-${i}`;
          card.innerHTML = `
            <div>
              <p class="text-sm font-medium mb-3" style="color:#8b7355;">${formatDate(p.date)}</p>
              <h3 class="text-2xl font-semibold mb-4" style="color:#5c4a32;">Daily Reflection</h3>
              <p class="leading-8 text-base mb-5" style="color:#6b5a45; line-height: 1.8;">${p.text}</p>
              <p class="italic text-sm" style="color:#9c8b74;">— ${p.closing}</p>
            </div>
            <div class="note-section">
              <div class="note-trigger" data-trigger="${entryId}">
                <span>📝</span> <span>Add Note</span>
              </div>
              <form class="note-form" data-form="${entryId}">
                <textarea class="note-input" placeholder="A note to this reflection..." data-textarea="${entryId}"></textarea>
                <button type="submit" class="note-save-btn">Save Note</button>
              </form>
            </div>`;
        }
        strip.appendChild(card);
      });

      positionStrip();
      updateIndicator(pages.length);
    }

    function positionStrip() {
      const strip = document.getElementById('page-strip');
      const wrapper = document.getElementById('strip-wrapper');
      const cards = strip.children;
      if (!cards.length) return;
      const wrapperW = wrapper.offsetWidth;
      const cardW = cards[0].offsetWidth + 16;
      const offset = (wrapperW / 2) - (cardW / 2) - (currentPage * cardW);
      strip.style.transform = `translateX(${offset}px)`;
      Array.from(cards).forEach((c, i) => {
        c.classList.toggle('active', i === currentPage);
      });
    }

    function updateIndicator(total) {
      document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${total}`;
      document.getElementById('prev-btn').style.opacity = currentPage === 0 ? '0.4' : '1';
      document.getElementById('prev-btn').style.pointerEvents = currentPage === 0 ? 'none' : 'auto';
      document.getElementById('next-btn').style.opacity = currentPage >= total - 1 ? '0.4' : '1';
      document.getElementById('next-btn').style.pointerEvents = currentPage >= total - 1 ? 'none' : 'auto';
    }

    function goTo(idx) {
      const pages = getPages();
      if (idx < 0 || idx >= pages.length) return;
      currentPage = idx;
      positionStrip();
      updateIndicator(pages.length);
    }

    document.getElementById('prev-btn').onclick = () => goTo(currentPage - 1);
    document.getElementById('next-btn').onclick = () => goTo(currentPage + 1);

    document.getElementById('prev-month-btn').onclick = () => changeMonth(-1);
    document.getElementById('next-month-btn').onclick = () => changeMonth(1);

    let startX = 0, isDragging = false;
    const wrapper = document.getElementById('strip-wrapper');
    wrapper.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isDragging = true; });
    wrapper.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      const diff = e.changedTouches[0].clientX - startX;
      if (Math.abs(diff) > 40) goTo(currentPage + (diff < 0 ? 1 : -1));
    });
    wrapper.addEventListener('mousedown', e => { startX = e.clientX; isDragging = true; });
    wrapper.addEventListener('mouseup', e => {
      if (!isDragging) return;
      isDragging = false;
      const diff = e.clientX - startX;
      if (Math.abs(diff) > 40) goTo(currentPage + (diff < 0 ? 1 : -1));
    });

    document.getElementById('page-strip').addEventListener('click', e => {
      const noteTrigger = e.target.closest('[data-trigger]');
      if (noteTrigger) {
        const id = noteTrigger.dataset.trigger;
        const form = document.querySelector(`[data-form="${id}"]`);
        if (form) {
          form.classList.toggle('visible');
          if (form.classList.contains('visible')) {
            const textarea = form.querySelector('textarea');
            if (textarea) textarea.focus();
          }
        }
        return;
      }

      const noteForm = e.target.closest('.note-form');
      if (noteForm && e.target.tagName === 'BUTTON' && e.target.type === 'submit') {
        e.preventDefault();
        const textarea = noteForm.querySelector('textarea');
        if (textarea && textarea.value.trim()) {
          textarea.value = '';
          noteForm.classList.remove('visible');
        }
      }
    });

    window.addEventListener('resize', positionStrip);

    updateMonthDisplay();
    renderStrip();
  </script>
