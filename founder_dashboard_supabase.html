<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .stat-card { border-radius: 16px; }
    select {
      background-color: #ffffff;
      border-color: #e5ddd5;
      color: #2d2520;
    }
    select:hover {
      border-color: #d4c4bb;
    }
    select:focus {
      border-color: #c2703a;
      box-shadow: 0 0 0 2px rgba(194, 112, 58, 0.1);
    }

    body {
      background: linear-gradient(180deg, #f3ece3 0%, #efe4d8 52%, #e7d8c9 100%);
      color: #2d2520;
    }
    .canva-card, .canva-section {
      background: rgba(255, 252, 247, 0.72);
      border: 1px solid rgba(178, 151, 124, 0.20);
      box-shadow: 0 18px 48px rgba(118, 93, 68, 0.10);
      backdrop-filter: blur(12px);
    }
    .dashboard-status {
      font-size: 0.78rem;
      color: #8b7355;
      margin-top: 0.75rem;
      min-height: 1.2rem;
    }
    .is-loading {
      opacity: 0.58;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script></head>
 <body data-template-id="__page-root" class="min-h-screen p-6 md:p-10">
  <header class="max-w-5xl mx-auto mb-8">
   <div class="flex items-start justify-between mb-4">
    <div>
     <h1 data-template-id="dashboard-title" class="canva-text"></h1>
     <p data-template-id="dashboard-subtitle" class="canva-text mt-1"></p>
    </div>
    <div class="flex gap-3">
     <div class="flex flex-col">
      <label data-template-id="month-label" class="canva-text text-xs font-semibold opacity-70 mb-1"></label> <select id="month-select" class="px-3 py-2 rounded-lg border border-gray-300 text-sm font-medium cursor-pointer hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-1" style="font-family: 'DM Sans', sans-serif;"> <option value="1">January</option> <option value="2">February</option> <option value="3">March</option> <option value="4">April</option> <option value="5">May</option> <option value="6" selected>June</option> <option value="7">July</option> <option value="8">August</option> <option value="9">September</option> <option value="10">October</option> <option value="11">November</option> <option value="12">December</option> </select>
     </div>
     <div class="flex flex-col">
      <label data-template-id="year-label" class="canva-text text-xs font-semibold opacity-70 mb-1"></label> <select id="year-select" class="px-3 py-2 rounded-lg border border-gray-300 text-sm font-medium cursor-pointer hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-1" style="font-family: 'DM Sans', sans-serif;"> <option value="2024">2024</option> <option value="2025">2025</option> <option value="2026" selected>2026</option> <option value="2027">2027</option> <option value="2028">2028</option> </select>
     </div>
    </div>
   </div>
  </header>
  <main class="max-w-5xl mx-auto"><!-- Row 1: 3 cards -->
   <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div data-template-id="card-total" class="canva-card stat-card p-5 flex flex-col items-center text-center">
     <p data-template-id="card-total-label" class="canva-text text-sm opacity-70"></p>
     <p data-template-id="card-total-value" class="canva-text text-5xl font-bold mt-2">247</p>
    </div>
    <div data-template-id="card-new" class="canva-card stat-card p-5 flex flex-col items-center text-center">
     <p data-template-id="card-new-label" class="canva-text text-sm opacity-70"></p>
     <p data-template-id="card-new-value" class="canva-text text-5xl font-bold mt-2">34</p>
    </div>
    <div data-template-id="card-status" class="canva-card stat-card p-5">
     <p data-template-id="card-status-label" class="canva-text text-sm opacity-70 mb-2"></p>
     <div class="space-y-1">
      <div class="flex justify-between items-center">
       <span data-template-id="status-active-label" class="canva-text text-sm"></span><span data-template-id="status-active-value" class="canva-text font-bold">182</span>
      </div>
      <div class="flex justify-between items-center">
       <span data-template-id="status-inactive-label" class="canva-text text-sm"></span><span data-template-id="status-inactive-value" class="canva-text font-bold">41</span>
      </div>
      <div class="flex justify-between items-center">
       <span data-template-id="status-churned-label" class="canva-text text-sm"></span><span data-template-id="status-churned-value" class="canva-text font-bold">24</span>
      </div>
     </div>
    </div>
   </div><!-- Row 2: Conversion & Health Rates -->
   <section data-template-id="health-section" class="canva-section stat-card p-6 mb-6">
    <h2 data-template-id="health-title" class="canva-text font-bold mb-4"></h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
     <div class="text-center">
      <p data-template-id="rate-onboarding-value" class="canva-text text-2xl font-bold">80%</p>
      <p data-template-id="rate-onboarding-label" class="canva-text text-sm opacity-70 mt-1"></p>
     </div>
     <div class="text-center">
      <p data-template-id="rate-reflection-value" class="canva-text text-2xl font-bold">27%</p>
      <p data-template-id="rate-reflection-label" class="canva-text text-sm opacity-70 mt-1"></p>
     </div>
     <div class="text-center">
      <p data-template-id="rate-review-value" class="canva-text text-2xl font-bold">21%</p>
      <p data-template-id="rate-review-label" class="canva-text text-sm opacity-70 mt-1"></p>
     </div>
     <div class="text-center">
      <p data-template-id="rate-journey-value" class="canva-text text-2xl font-bold">36%</p>
      <p data-template-id="rate-journey-label" class="canva-text text-sm opacity-70 mt-1"></p>
     </div>
    </div>
   </section><!-- Row 3: 4 cards -->
   <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div data-template-id="card-onboarding" class="canva-card stat-card p-5">
     <p data-template-id="card-onboarding-label" class="canva-text text-sm opacity-70"></p>
     <p data-template-id="card-onboarding-value" class="canva-text text-3xl font-bold mt-1">198</p>
    </div>
    <div data-template-id="card-chat" class="canva-card stat-card p-5">
     <p data-template-id="card-chat-label" class="canva-text text-sm opacity-70"></p>
     <p data-template-id="card-chat-value" class="canva-text text-3xl font-bold mt-1">67</p>
    </div>
    <div data-template-id="card-review" class="canva-card stat-card p-5">
     <p data-template-id="card-review-label" class="canva-text text-sm opacity-70"></p>
     <p data-template-id="card-review-value" class="canva-text text-3xl font-bold mt-1">52</p>
    </div>
    <div data-template-id="card-card" class="canva-card stat-card p-5">
     <p data-template-id="card-card-label" class="canva-text text-sm opacity-70"></p>
     <p data-template-id="card-card-value" class="canva-text text-3xl font-bold mt-1">89</p>
    </div>
   </div>
  </main>
  <script>
    const SUPABASE_URL = 'https://foizrwegmdnekaxsahxu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvaXpyd2VnbWRuZWtheHNhaHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMjQwODEsImV4cCI6MjA4ODgwMDA4MX0._RbaB-OQd7AS48A3O50-CdQ7UaJZ6KGR8NCz56TUFtA';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const el = (id) => document.querySelector(`[data-template-id="${id}"]`) || document.getElementById(id);
    const setText = (id, value) => { const node = el(id); if (node) node.textContent = value; };
    const fmt = (value) => Number(value || 0).toLocaleString('en-US');
    const pct = (part, base) => base > 0 ? `${Math.round((part / base) * 100)}%` : '0%';

    const labels = {
      'dashboard-title': 'Founder Dashboard',
      'dashboard-subtitle': 'A quiet view of CalmNow usage',
      'month-label': 'Month',
      'year-label': 'Year',
      'card-total-label': 'Total Users',
      'card-new-label': 'New Users This Month',
      'card-status-label': 'User Status',
      'status-active-label': 'Active / Trial',
      'status-inactive-label': 'Inactive / Past Due',
      'status-churned-label': 'Expired / Deleted',
      'health-title': 'Conversion & Product Health',
      'rate-onboarding-label': 'Onboarding Completion',
      'rate-reflection-label': 'Reflection Users',
      'rate-review-label': 'Monthly Review Users',
      'rate-journey-label': 'Journey Users',
      'card-onboarding-label': 'Onboarded Users',
      'card-chat-label': 'Chat Users This Month',
      'card-review-label': 'Monthly Review Users',
      'card-card-label': 'Card Users This Month'
    };

    Object.entries(labels).forEach(([id, value]) => setText(id, value));

    function monthRange(year, monthNumber) {
      const start = new Date(Date.UTC(year, monthNumber - 1, 1, 0, 0, 0));
      const end = new Date(Date.UTC(year, monthNumber, 1, 0, 0, 0));
      return { start: start.toISOString(), end: end.toISOString() };
    }

    async function countRows(table, column = 'id', filters = []) {
      let query = supabaseClient.from(table).select(column, { count: 'exact', head: true });
      filters.forEach((fn) => { query = fn(query); });
      const { count, error } = await query;
      if (error) throw new Error(`${table}: ${error.message}`);
      return count || 0;
    }

    async function distinctUsers(table, dateColumn, start, end) {
      const { data, error } = await supabaseClient
        .from(table)
        .select('user_id')
        .gte(dateColumn, start)
        .lt(dateColumn, end)
        .not('user_id', 'is', null);
      if (error) throw new Error(`${table}: ${error.message}`);
      return new Set((data || []).map(row => row.user_id).filter(Boolean)).size;
    }


    function dateOnly(isoString) {
      return String(isoString || '').slice(0, 10);
    }

    async function safeDistinctActors(tableNames, dateColumn, start, end) {
      for (const table of tableNames) {
        const selectors = ['user_id, session_id', 'user_id', 'session_id'];
        for (const selector of selectors) {
          const { data, error } = await supabaseClient
            .from(table)
            .select(selector)
            .gte(dateColumn, start)
            .lt(dateColumn, end);

          if (!error) {
            const unique = new Set(
              (data || [])
                .map(row => row.user_id || row.session_id)
                .filter(Boolean)
            );
            return unique.size;
          }
        }
      }
      return 0;
    }

    async function loadDashboard() {
      const status = document.getElementById('dashboardStatus');
      document.body.classList.add('is-loading');
      if (status) status.textContent = 'Loading Supabase data...';

      const month = Number(document.getElementById('month-select')?.value || 1);
      const year = Number(document.getElementById('year-select')?.value || new Date().getFullYear());
      const { start, end } = monthRange(year, month);

      try {
        const [
          totalUsers,
          newUsers,
          activeUsers,
          inactiveUsers,
          churnedUsers,
          onboardedUsers,
          chatUsers,
          reviewUsers,
          cardUsers,
          journeyUsers
        ] = await Promise.all([
          countRows('profiles'),
          countRows('profiles', 'id', [q => q.gte('created_at', start), q => q.lt('created_at', end)]),
          countRows('profiles', 'id', [q => q.in('subscription_status', ['active', 'trial'])]),
          countRows('profiles', 'id', [q => q.in('subscription_status', ['inactive', 'past_due'])]),
          countRows('profiles', 'id', [q => q.in('subscription_status', ['expired', 'deleted'])]),
          countRows('user_onboarding'),
          safeDistinctActors(['user_chat_messages', 'n8n_chat_histories'], 'created_at', start, end),
          safeDistinctActors(['monthly_reviews'], 'created_at', start, end),
          safeDistinctActors(['user_card_sessions'], 'created_at', start, end),
          safeDistinctActors(['daily_reflections'], 'reflection_date', dateOnly(start), dateOnly(end))
        ]);

        setText('card-total-value', fmt(totalUsers));
        setText('card-new-value', fmt(newUsers));
        setText('status-active-value', fmt(activeUsers));
        setText('status-inactive-value', fmt(inactiveUsers));
        setText('status-churned-value', fmt(churnedUsers));
        setText('card-onboarding-value', fmt(onboardedUsers));
        setText('card-chat-value', fmt(chatUsers));
        setText('card-review-value', fmt(reviewUsers));
        setText('card-card-value', fmt(cardUsers));

        setText('rate-onboarding-value', pct(onboardedUsers, totalUsers));
        setText('rate-reflection-value', pct(journeyUsers, totalUsers));
        setText('rate-review-value', pct(reviewUsers, totalUsers));
        setText('rate-journey-value', pct(journeyUsers, totalUsers));

        if (status) status.textContent = `Synced with Supabase · ${new Date().toLocaleString()}`;
      } catch (err) {
        console.error('Founder dashboard error:', err);
        if (status) status.textContent = `Supabase error: ${err.message}`;
      } finally {
        document.body.classList.remove('is-loading');
      }
    }

    document.getElementById('month-select')?.addEventListener('change', loadDashboard);
    document.getElementById('year-select')?.addEventListener('change', loadDashboard);
    loadDashboard();
  </script>
 </body>
</html>
