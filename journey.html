<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://foizrwegmdnekaxsahxu.supabase.co/storage/v1/object/public/sound-images/Calmnow_logo.png">
  <style>
    body { font-family: 'Jost', sans-serif; }
    h1, h2, h3 { font-family: 'Cormorant Garamond', serif; }
    .month-pill { transition: all 0.2s ease; }
    .month-pill.active { background: #8b7355; color: #faf6f0; }
    .strip-wrapper { overflow: hidden; width: 100%; }
    .page-strip {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      align-items: center;
    }
    .page-card {
      flex-shrink: 0;
      width: 85%;
      max-width: 420px;
      margin: 0 8px;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      transform: scale(0.82);
      opacity: 0.45;
      border-radius: 1.25rem;
      background: #fffcf8;
      padding: 2.5rem 2rem;
      min-height: 420px;
      box-shadow: 0 2px 12px rgba(140,115,80,0.06);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .page-card.active {
      transform: scale(1);
      opacity: 1;
      box-shadow: 0 8px 32px rgba(140,115,80,0.13);
    }
    .note-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f0e8df;
    }
    .note-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: #8b7355;
      transition: opacity 0.2s ease;
    }
    .note-trigger:hover {
      opacity: 0.7;
    }
    .note-form {
      margin-top: 1rem;
      display: none;
    }
    .note-form.visible {
      display: block;
    }
    .note-input {
      width: 100%;
      min-height: 72px;
      padding: 0.75rem;
      border: 1px solid #e0d8cc;
      border-radius: 0.5rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.875rem;
      color: #75634f;
      background: #fefbf7;
      resize: none;
      margin-bottom: 0.75rem;
    }
    .note-input::placeholder {
      color: #b8a990;
    }
    .note-input:focus {
      outline: none;
      border-color: #8b7355;
      background: #fffcf8;
    }
    .note-save-btn {
      padding: 0.5rem 1rem;
      background: #8b7355;
      color: #faf6f0;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .note-save-btn:hover {
      background: #6b5442;
    }
    .note-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .voice-note-btn {
      padding: 0.5rem 0.85rem;
      background: #f5efe7;
      color: #8b7355;
      border: 1px solid #e4d7c7;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .voice-note-btn.listening {
      background: #8b7355;
      color: #faf6f0;
    }
    .note-cancel-btn {
      padding: 0.5rem 0.85rem;
      background: transparent;
      color: #9c8b74;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s ease, color 0.2s ease;
    }
    .note-cancel-btn:hover {
      opacity: 0.78;
      color: #6b5442;
    }
    .note-status {
      font-size: 0.76rem;
      color: #b8a990;
      line-height: 1.5;
    }
    .saved-note {
      margin-top: 0.75rem;
      padding: 0.75rem 0.9rem 0.8rem;
      border-radius: 0.9rem;
      background: #f8f2eb;
      color: #75634f;
      font-size: 0.85rem;
      line-height: 1.65;
      height: auto !important;
      min-height: 0 !important;
    }
    .saved-note-text {
      display: block;
      margin: 0;
      padding: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .saved-note-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .note-mini-btn {
      border: none;
      background: transparent;
      color: #9c8b74;
      font-family: 'Jost', sans-serif;
      font-size: 0.74rem;
      cursor: pointer;
      padding: 0;
      opacity: 0.86;
      transition: opacity 0.2s ease, color 0.2s ease;
    }
    .note-mini-btn:hover {
      opacity: 1;
      color: #6b5442;
    }
    .note-mini-btn.delete {
      color: #b07a7a;
    }
    .note-edit-form {
      display: none;
      margin-top: 0.7rem;
    }
    .note-edit-form.visible {
      display: block;
    }
    .note-edit-input {
      width: 100%;
      min-height: 64px;
      padding: 0.7rem;
      border: 1px solid #e0d8cc;
      border-radius: 0.5rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.84rem;
      color: #75634f;
      background: #fffcf8;
      resize: vertical;
      margin-bottom: 0.6rem;
    }
   .saved-note {
   display: block;
   height: auto !important;
   min-height: 0 !important;
   }

  .saved-note-actions {
   margin-top: 0.55rem;
   }

    .page-card:has(.saved-note) {
      min-height: auto !important;
    }

    @media (max-width: 640px) {
      .page-card:has(.saved-note) {
        min-height: auto !important;
      }
    }
    .empty-state {
      width: 85%;
      max-width: 420px;
      min-height: 300px;
      margin: 0 auto;
      border-radius: 1.25rem;
      background: #fffcf8;
      padding: 2.25rem 2rem;
      box-shadow: 0 8px 32px rgba(140,115,80,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      color: #9c8b74;
      line-height: 1.8;
    }

    .gentle-direction {
  font-style: italic;
  font-size: 1rem;
  color: #9c8b74;
  margin-bottom: 1.25rem;
}
    .reflection-tags {
      margin-top: 0.85rem;
      font-size: 0.72rem;
      color: #b8a990;
      font-style: italic;
      letter-spacing: 0.02em;
    }


    .mobile-month-switcher {
      display: none;
      width: 100%;
      max-width: 420px;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 1.25rem;
      padding: 0.15rem 0.25rem;
      color: #5c4a32;
    }

    .mobile-month-arrow {
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      color: #5c4a32;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.95;
    }

    .mobile-month-title {
      font-family: 'Jost', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: #5c4a32;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @media (max-width: 640px) {
      #month-nav {
        display: none !important;
      }

      .mobile-month-switcher {
        display: flex;
      }
    }


    /* Top navigation actions for standalone Journey page */
    .journey-top-actions {
      position: fixed;
      top: 2rem;
      left: 2rem;
      right: 2rem;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .journey-back-main-btn,
    .journey-chat-btn {
      pointer-events: auto;
      border: 1px solid rgba(180, 165, 145, 0.26);
      background: rgba(255, 252, 247, 0.58);
      color: #9a8064;
      box-shadow: 0 18px 42px rgba(139, 115, 85, 0.10), inset 0 1px 0 rgba(255,255,255,0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      transition: transform 0.32s ease, background 0.32s ease, border-color 0.32s ease, color 0.32s ease;
    }

    .journey-back-main-btn:hover,
    .journey-chat-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 252, 247, 0.86);
      border-color: rgba(180, 165, 145, 0.38);
      color: #7b6046;
    }

    .journey-back-main-btn {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      line-height: 1;
      font-weight: 300;
      padding: 0 0 0.12rem 0;
    }

    .journey-chat-btn {
      min-height: 52px;
      padding: 0 1.45rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .journey-chat-icon {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: end;
      justify-content: center;
      gap: 3px;
      opacity: 0.92;
    }

    .journey-chat-icon span {
      width: 2px;
      border-radius: 999px;
      background: currentColor;
      display: block;
    }

    .journey-chat-icon span:nth-child(1) { height: 10px; opacity: 0.7; }
    .journey-chat-icon span:nth-child(2) { height: 17px; opacity: 0.95; }
    .journey-chat-icon span:nth-child(3) { height: 7px; opacity: 0.62; }
    .journey-chat-icon span:nth-child(4) { height: 13px; opacity: 0.82; }

    @media (max-width: 640px) {
      .journey-top-actions {
        top: 1.1rem;
        left: 1.05rem;
        right: 1.05rem;
      }

      .journey-back-main-btn {
        width: 48px;
        height: 48px;
        font-size: 1.65rem;
      }

      .journey-chat-btn {
        min-height: 46px;
        padding: 0 1.05rem;
        font-size: 0.86rem;
        gap: 0.6rem;
      }

      .journey-chat-icon {
        width: 19px;
        height: 19px;
        gap: 2.5px;
      }
    }

    /* Monthly review letter */
    .monthly-letter-trigger {
      margin-top: 1.7rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      border: none;
      background: transparent;
      color: #8b7355;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.08rem;
      line-height: 1.4;
      cursor: pointer;
      padding: 0.35rem 0.2rem 0.25rem;
      position: relative;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .monthly-letter-trigger::after {
      content: "";
      position: absolute;
      left: 0.35rem;
      right: 0.35rem;
      bottom: 0;
      border-bottom: 1px dashed rgba(139, 115, 85, 0.28);
    }

    .monthly-letter-trigger:hover {
      opacity: 0.72;
      transform: translateY(-1px);
    }

    .monthly-letter-icon {
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .monthly-letter-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: rgba(72, 64, 55, 0.36);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .monthly-letter-modal.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .monthly-letter-close {
      position: fixed;
      top: 1.35rem;
      right: 1.35rem;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(180, 165, 145, 0.28);
      background: rgba(255, 252, 247, 0.78);
      color: #8b7355;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 16px 36px rgba(80, 65, 48, 0.12);
    }

   .monthly-letter-paper {
  width: min(92vw, 480px);
  max-height: min(82vh, 760px);
  overflow-y: auto;
  border-radius: 28px;
  background:
    radial-gradient(circle at top center, rgba(255,255,255,0.86) 0%, rgba(255,255,255,0) 38%),
    linear-gradient(180deg, #fffaf3 0%, #fbf2e7 100%);
  border: 1px solid rgba(209, 191, 166, 0.5);
  box-shadow:
    0 28px 80px rgba(58, 49, 39, 0.22),
    inset 0 1px 0 rgba(255,255,255,0.8);
  padding: 2.7rem 2.25rem 2.35rem;

  transform: translateY(40px) scale(0.93);
  opacity: 0;

  transition:
    transform 1.8s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 1.8s ease;

  color: #5c4a32;
}

    .monthly-letter-modal.visible .monthly-letter-paper {
  transform: translateY(0) scale(1);
  opacity: 1;
}

    .monthly-letter-seal {
      width: 54px;
      height: 54px;
      margin: 0 auto 1.1rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b49776;
      border: 1px solid rgba(180, 165, 145, 0.26);
      background: rgba(255,252,247,0.68);
      font-size: 1.55rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
    }

    .monthly-letter-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      line-height: 1.08;
      font-weight: 500;
      text-align: center;
      color: #4f3f2e;
      margin: 0;
    }

    .monthly-letter-divider {
      width: 170px;
      height: 1px;
      margin: 1.45rem auto 1.6rem;
      background: linear-gradient(90deg, transparent, rgba(139,115,85,0.28), transparent);
      position: relative;
    }

    .monthly-letter-divider::after {
      content: "♥";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -53%);
      background: #fff7ee;
      color: rgba(139,115,85,0.48);
      padding: 0 0.55rem;
      font-size: 0.8rem;
    }

    .monthly-letter-label {
      margin: 1.25rem 0 0.45rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8b7355;
    }

    .monthly-letter-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      line-height: 1.25;
      color: #5c4a32;
      margin: 0.1rem 0 1rem;
    }

    .monthly-letter-body {
      font-family: 'Jost', sans-serif;
      font-size: 0.96rem;
      line-height: 1.9;
      color: #75634f;
      white-space: pre-wrap;
      margin: 0;
    }

    .monthly-theme-list {
      display: grid;
      gap: 0.9rem;
      margin: 0.85rem 0 0.25rem;
    }

    .monthly-theme-row {
      display: grid;
      grid-template-columns: minmax(90px, 0.95fr) minmax(110px, 1.25fr) 44px;
      align-items: center;
      gap: 0.85rem;
      padding-bottom: 0.78rem;
      border-bottom: 1px solid rgba(180, 165, 145, 0.16);
    }

    .monthly-theme-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .monthly-theme-name {
      font-family: 'Jost', sans-serif;
      font-size: 0.92rem;
      color: #5c4a32;
      line-height: 1.35;
    }

    .monthly-theme-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(232, 224, 213, 0.72);
      overflow: hidden;
    }

    .monthly-theme-fill {
      height: 100%;
      min-width: 8px;
      border-radius: inherit;
      background: linear-gradient(90deg, #b9a188, #9f8468);
    }

    .monthly-theme-percent {
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      color: #5c4a32;
      text-align: right;
      white-space: nowrap;
    }

    .monthly-theme-empty {
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
      line-height: 1.75;
      color: #9c8b74;
    }

    .monthly-letter-close-text {
      margin-top: 1.45rem;
      padding-top: 1.15rem;
      border-top: 1px solid rgba(180,165,145,0.22);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      line-height: 1.55;
      color: #8b7355;
      white-space: pre-wrap;
    }

    @media (max-width: 640px) {
      .monthly-theme-row {
        grid-template-columns: 1fr 42px;
        gap: 0.45rem 0.75rem;
      }

      .monthly-theme-name {
        font-size: 0.88rem;
      }

      .monthly-theme-track {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .monthly-theme-percent {
        font-size: 0.86rem;
      }

      .monthly-letter-paper {
        width: min(92vw, 430px);
        padding: 2.25rem 1.65rem 2rem;
        border-radius: 24px;
      }

      .monthly-letter-title {
        font-size: 1.95rem;
      }

      .monthly-letter-close {
        width: 44px;
        height: 44px;
        top: 1rem;
        right: 1rem;
      }
    }


    /* Mobile Journey spacing polish — tighter month/card rhythm + centered loading */
    .page-strip.loading {
      width: 100%;
      justify-content: center;
      transform: none !important;
    }

    .page-strip.loading .empty-state {
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 640px) {
      body {
        min-height: 100dvh;
        padding-top: calc(5.25rem + env(safe-area-inset-top)) !important;
        padding-bottom: calc(1.15rem + env(safe-area-inset-bottom)) !important;
      }

      header {
        margin-bottom: 0.55rem !important;
      }

      [data-template-id="page-title"] {
        font-size: clamp(3.05rem, 13.5vw, 4rem) !important;
        line-height: 0.95 !important;
      }

      [data-template-id="page-subtitle"] {
        max-width: 82vw;
        margin-left: auto;
        margin-right: auto;
        margin-top: 0.8rem !important;
        font-size: 0.94rem !important;
        line-height: 1.5 !important;
      }

      .mobile-month-switcher {
        max-width: 86vw;
        margin-bottom: 0.05rem !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        transform: translateY(-0.15rem);
      }

      .mobile-month-arrow {
        width: 38px;
        height: 38px;
        font-size: 2.05rem;
      }

      .mobile-month-title {
        font-size: 1.18rem;
      }

      main {
        margin-top: 0 !important;
      }

      .strip-wrapper {
        margin-top: -0.9rem;
      }

      .page-strip {
        align-items: flex-start;
      }

      .page-card {
        width: 78vw;
        max-width: 330px;
        min-height: 395px;
        padding: 2rem 1.55rem;
        border-radius: 1.35rem;
      }

      .page-card.active {
        box-shadow: 0 10px 30px rgba(140,115,80,0.12);
      }

      .page-card .leading-8 {
        line-height: 1.72 !important;
      }

      .gentle-direction {
        font-size: 1.04rem;
        line-height: 1.55;
        margin-bottom: 1rem;
      }

      .note-section {
        margin-top: 1.1rem;
        padding-top: 1.1rem;
      }

      .empty-state {
        width: 78vw;
        max-width: 330px;
        min-height: 300px;
        padding: 2rem 1.35rem;
        align-items: center;
        justify-content: center;
      }

      .page-strip.loading {
        min-height: 315px;
        align-items: center;
      }

      main > .flex.items-center.gap-4.mt-6 {
        margin-top: 0.85rem !important;
        gap: 0.9rem !important;
      }

      #prev-btn,
      #next-btn {
        background: transparent !important;
        padding: 0.45rem 0.55rem !important;
        font-size: 1.02rem !important;
      }

      #page-indicator {
        font-size: 0.88rem !important;
      }
    }

    @media (max-height: 740px) and (max-width: 640px) {
      body {
        padding-top: calc(4.65rem + env(safe-area-inset-top)) !important;
      }

      header {
        margin-bottom: 0.25rem !important;
      }

      [data-template-id="page-title"] {
        font-size: clamp(2.75rem, 12vw, 3.45rem) !important;
      }

      [data-template-id="page-subtitle"] {
        margin-top: 0.45rem !important;
        font-size: 0.86rem !important;
      }

      .mobile-month-switcher {
        margin-bottom: -0.35rem !important;
      }

      .strip-wrapper {
        margin-top: -1.35rem;
      }

      .page-card {
        min-height: 365px;
        padding-top: 1.75rem;
        padding-bottom: 1.65rem;
      }

      main > .flex.items-center.gap-4.mt-6 {
        margin-top: 0.5rem !important;
      }
    }
@media (max-width: 640px) {
  body {
    padding-top: 4.8rem !important;
    padding-bottom: 1.6rem !important;

    function escapeHtml(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function toLocalDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function updateMobileMonthTitle() {
      const title = document.getElementById('mobile-month-title');
      if (!title) return;
      title.textContent = `${months[selectedMonth]} ${selectedYear}`;

    function getMonthRange(year, monthIndex) {
      const start = new Date(year, monthIndex, 1);
      const end = new Date(year, monthIndex + 1, 1);
      return { start: toLocalDateKey(start), end: toLocalDateKey(end) };
    }

    async function initAuth() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) console.warn('auth session error:', error);
      currentUser = data?.session?.user || null;
      if (currentUser?.id) {
        sessionId = currentUser.id;
        localStorage.setItem('calmnow_session_id', sessionId);
        window.calmIdentifyUser?.(currentUser);
      }
    }

    function getSelectedReviewMonthKey() {
      return `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}-01`;
    }

    async function loadMonthlyReview() {
      currentMonthlyReview = null;

      if (!currentUser?.id) return null;

      const { data, error } = await supabaseClient
        .from('monthly_reviews')
        .select('id, session_id, review_month, title, summary, gentle_close, tags, themes, theme_percentages, created_at')
        .eq('session_id', currentUser.id)
        .eq('review_month', getSelectedReviewMonthKey())
        .maybeSingle();

      if (error) {
        console.error('load monthly review error:', error);
        return null;
      }

      currentMonthlyReview = data || null;
      return currentMonthlyReview;
    }

    async function loadNotesForReflections(reflectionIds = []) {
      reflectionNotesById = {};
      if (!currentUser?.id || reflectionIds.length === 0) return;

      const { data, error } = await supabaseClient
        .from('journey_notes')
        .select('id, reflection_id, note_text, voice_transcript, created_at, updated_at')
        .eq('user_id', currentUser.id)
        .in('reflection_id', reflectionIds)
        .order('updated_at', { ascending: false });

      if (error) {
        console.error('load notes error:', error);
        return;
      }

      (data || []).forEach(note => {
        if (!reflectionNotesById[note.reflection_id]) reflectionNotesById[note.reflection_id] = [];
        reflectionNotesById[note.reflection_id].push(note);
      });
    }

    async function loadJourneyData() {
      const strip = document.getElementById('page-strip');
      if (strip) {
        strip.classList.add('loading');
        strip.style.transform = 'none';
        strip.innerHTML = `<div class="empty-state">Loading your reflections softly...</div>`;
      }

      if (!currentUser?.id) {
        journalData[selectedMonth] = [];
        currentMonthlyReview = null;
        renderMonths();
        renderStrip('Please log in first so CalmNow can keep your Journey safely.');
        return;
      }

      await loadMonthlyReview();

      const { start, end } = getMonthRange(selectedYear, selectedMonth);
      let query = supabaseClient
        .from('daily_reflections')
        .select('id, user_id, session_id, reflection_date, reflection, tags, gentle_direction, created_at')
        .gte('reflection_date', start)
        .lt('reflection_date', end)
        .order('reflection_date', { ascending: true });

      if (currentUser?.id) {
        query = query.eq('user_id', currentUser.id);
      } else {
        query = query.eq('session_id', sessionId);
      }

      const { data, error } = await query;

      if (error) {
        console.error('load daily reflections error:', error);
        journalData[selectedMonth] = [];
        renderMonths();
        renderStrip('Could not load reflections yet. Please make sure the SQL update has been run.');
        return;
      }

      journalData[selectedMonth] = (data || []).map(row => ({
        id: row.id,
        session_id: row.session_id,
        user_id: row.user_id,
        date: row.reflection_date,
        text: row.reflection,
        closing: row.gentle_direction || 'Stay close to what is true.',
        tags: Array.isArray(row.tags) ? row.tags : []
      }));

      await loadNotesForReflections(journalData[selectedMonth].map(r => r.id));
      renderMonths();
      renderStrip();
    }

    function formatDate(dateStr) {
      const date = new Date(`${dateStr}T00:00:00`);
      const monthName = date.toLocaleString('en-US', { month: 'long' });
      return `${date.getDate()} ${monthName} ${date.getFullYear()}`;
    }

    function getPages() {
      const entries = journalData[selectedMonth] || [];
      const pages = [{ type: 'cover', month: months[selectedMonth], count: entries.length, monthlyReview: currentMonthlyReview }];
      entries.forEach(e => pages.push({ type: 'entry', ...e }));
      return pages;
    }

    function renderMonths() {
  updateMobileMonthTitle();
  const nav = document.getElementById('month-nav');
  nav.innerHTML = '';

  months.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.textContent = m.slice(0, 3);
    btn.className = `month-pill px-3 py-1.5 rounded-full text-sm cursor-pointer ${i === selectedMonth ? 'active' : ''}`;

    if (i !== selectedMonth) {
      btn.style.cssText = 'background:#f5efe7;color:#8b7355;';
    }

    btn.onclick = async () => {
      selectedMonth = i;
      currentPage = 0;
      await loadJourneyData();
    };

    nav.appendChild(btn);
  });
}

    function renderSavedNotes(reflectionId) {
      const notes = reflectionNotesById[reflectionId] || [];
      if (!notes.length) return '';

      return notes.map(note => {
        const noteText = note.note_text || note.voice_transcript || '';
        return `
          <div class="saved-note" data-note-id="${note.id}" data-note-reflection-id="${reflectionId}">
            <div class="saved-note-text" data-note-text="${note.id}">${escapeHtml(noteText)}</div>
            <form class="note-edit-form" data-note-edit-form="${note.id}">
              <textarea class="note-edit-input" data-note-edit-input="${note.id}">${escapeHtml(noteText)}</textarea>
              <div class="saved-note-actions">
                <button type="submit" class="note-mini-btn" data-save-note-edit="${note.id}">Save</button>
                <button type="button" class="note-mini-btn" data-cancel-note-edit="${note.id}">Cancel</button>
              </div>
            </form>
            <div class="saved-note-actions" data-note-view-actions="${note.id}">
              <button type="button" class="note-mini-btn" data-edit-note="${note.id}">Edit</button>
              <button type="button" class="note-mini-btn delete" data-delete-note="${note.id}">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderStrip(emptyMessage = '') {
      const pages = getPages();
      const strip = document.getElementById('page-strip');
      strip.classList.remove('loading');
      strip.innerHTML = '';

      if (emptyMessage) {
        strip.innerHTML = `<div class="empty-state">${escapeHtml(emptyMessage)}</div>`;
        updateIndicator(1);
        return;
      }

      pages.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'page-card' + (i === currentPage ? ' active' : '');
        if (p.type === 'cover' && Number(p.count || 0) === 0) {
          card.classList.add('cover-empty-month');
        }
        if (p.type === 'cover') {
          const monthlyLetterButton = p.monthlyReview ? `
              <button class="monthly-letter-trigger" type="button" data-open-monthly-letter>
                <span class="monthly-letter-icon">✉</span>
                <span>A Quiet Letter from ${escapeHtml(p.month)}</span>
              </button>
          ` : '';

          card.innerHTML = `
            <div class="text-center py-8 flex-1 flex flex-col justify-center">
              <h2 class="text-3xl font-semibold" style="color:#5c4a32;">${p.month}</h2>
              <p class="mt-3 text-sm" style="color:#b3a28f;">${p.count} reflection${p.count !== 1 ? 's' : ''} this month</p>
              ${monthlyLetterButton}
              <p class="mt-6 italic text-sm" style="color:#8b7355;">Swipe or use buttons to begin</p>
            </div>`;
        } else {
          const entryId = `reflection-${p.id}`;
          const tagText = (p.tags || []).map(t => typeof t === 'string' ? t : t?.label || t?.name || '').filter(Boolean).join(' · ');
          card.innerHTML = `
            <div>
              <p class="text-sm font-medium mb-3" style="color:#8b7355;">${formatDate(p.date)}</p>
              <p class="gentle-direction mb-4">— ${escapeHtml(p.closing)}</p>
              <p class="leading-8 text-base mb-5" style="color:#75634f; line-height: 1.8;">${escapeHtml(p.text)}</p>
              <p class="reflection-tags">${escapeHtml(tagText || 'quiet · soft · present')}</p>
            </div>
            <div class="note-section">
              <div class="note-trigger" data-trigger="${entryId}">
                <span>✎ᝰ.</span> <span>Add Note</span>
              </div>
              <form class="note-form" data-form="${entryId}" data-reflection-id="${p.id}">
                <textarea class="note-input" placeholder="A note to this reflection..." data-textarea="${entryId}"></textarea>
                <div class="note-actions">
                  <button type="submit" class="note-save-btn">Save Note</button>
                  <button type="button" class="voice-note-btn" data-voice-btn="${entryId}">🎙 Voice</button>
                  <button type="button" class="note-cancel-btn" data-cancel-note-form="${entryId}">Cancel</button>
                  <span class="note-status" data-status="${entryId}"></span>
                </div>
              </form>
              <div data-saved-notes="${p.id}">${renderSavedNotes(p.id)}</div>
            </div>`;
        }
        strip.appendChild(card);
      });

      positionStrip();
      updateIndicator(pages.length);
    }

    function positionStrip() {
      const strip = document.getElementById('page-strip');
      const wrapper = document.getElementById('strip-wrapper');
      const cards = strip.children;
      if (!cards.length) return;
      const wrapperW = wrapper.offsetWidth;
      const cardW = cards[0].offsetWidth + 16;
      const offset = (wrapperW / 2) - (cardW / 2) - (currentPage * cardW);
      strip.style.transform = `translateX(${offset}px)`;
      Array.from(cards).forEach((c, i) => c.classList.toggle('active', i === currentPage));
    }

    function updateIndicator(total) {
      document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${total}`;
      document.getElementById('prev-btn').style.opacity = currentPage === 0 ? '0.4' : '1';
      document.getElementById('prev-btn').style.pointerEvents = currentPage === 0 ? 'none' : 'auto';
      document.getElementById('next-btn').style.opacity = currentPage >= total - 1 ? '0.4' : '1';
      document.getElementById('next-btn').style.pointerEvents = currentPage >= total - 1 ? 'none' : 'auto';
    }

    function goTo(idx) {
      const pages = getPages();
      if (idx < 0 || idx >= pages.length) return;
      currentPage = idx;
      positionStrip();
      updateIndicator(pages.length);
    }

    function normalizeThemePercentages(review) {
      const rawPercentages = review?.theme_percentages;
      const rawThemes = review?.themes;
      let items = [];

      if (Array.isArray(rawPercentages)) {
        items = rawPercentages.map((item, index) => {
          if (typeof item === 'number') {
            return {
              name: Array.isArray(rawThemes) ? rawThemes[index] : `Theme ${index + 1}`,
              percentage: item
            };
          }

          if (item && typeof item === 'object') {
            return {
              name: item.name || item.theme || item.label || (Array.isArray(rawThemes) ? rawThemes[index] : `Theme ${index + 1}`),
              percentage: item.percentage ?? item.percent ?? item.value ?? item.score ?? 0
            };
          }

          return null;
        }).filter(Boolean);
      } else if (rawPercentages && typeof rawPercentages === 'object') {
        items = Object.entries(rawPercentages).map(([name, percentage]) => ({ name, percentage }));
      } else if (Array.isArray(rawThemes)) {
        items = rawThemes.map((item, index) => {
          if (typeof item === 'string') return { name: item, percentage: 0 };
          if (item && typeof item === 'object') {
            return {
              name: item.name || item.theme || item.label || `Theme ${index + 1}`,
              percentage: item.percentage ?? item.percent ?? item.value ?? item.score ?? 0
            };
          }
          return null;
        }).filter(Boolean);
      }

      return items
        .map(item => {
          const percentage = Math.max(0, Math.min(100, Math.round(Number(item.percentage) || 0)));
          const name = String(item.name || 'Other').replaceAll('_', ' ').trim();
          return { name: name.charAt(0).toUpperCase() + name.slice(1), percentage };
        })
        .filter(item => item.name && item.percentage > 0)
        .sort((a, b) => b.percentage - a.percentage);
    }

    function renderMonthlyThemePercentages(review) {
      const items = normalizeThemePercentages(review);

      if (!items.length) {
        return `
          <p class="monthly-letter-label">What stayed on your mind</p>
          <p class="monthly-theme-empty">No theme percentages were saved for this month yet.</p>
        `;
      }

      return `
        <p class="monthly-letter-label">What stayed on your mind</p>
        <div class="monthly-theme-list">
          ${items.map(item => `
            <div class="monthly-theme-row">
              <div class="monthly-theme-name">${escapeHtml(item.name)}</div>
              <div class="monthly-theme-track" aria-hidden="true">
                <div class="monthly-theme-fill" style="width:${item.percentage}%;"></div>
              </div>
              <div class="monthly-theme-percent">${item.percentage}%</div>
            </div>
          `).join('')}
        </div>
      `;
    }

      window.calmTrack?.('Monthly Review Opened');

      const modal = document.getElementById('monthlyLetterModal');
      const title = document.getElementById('monthlyLetterTitle');
      const content = document.getElementById('monthlyLetterContent');
      const monthName = months[selectedMonth];

      if (title) title.textContent = `A Quiet Letter from ${monthName}`;

      const reviewTitle = currentMonthlyReview.title || `What ${monthName} has been teaching you`;
      const summary = currentMonthlyReview.summary || 'This month left a quiet trace.';
      const gentleClose = currentMonthlyReview.gentle_close || 'Keep staying close to yourself.';

      if (content) {
        content.innerHTML = `
          <p class="monthly-letter-label">Title</p>
          <h3 class="monthly-letter-heading">${escapeHtml(reviewTitle)}</h3>

          <p class="monthly-letter-label">Summary</p>
          <p class="monthly-letter-body">${escapeHtml(summary)}</p>

          ${renderMonthlyThemePercentages(currentMonthlyReview)}

          <p class="monthly-letter-label">Gentle Close</p>
          <div class="monthly-letter-close-text">${escapeHtml(gentleClose)}</div>
        `;
      }

      if (modal) {
        modal.classList.add('visible');
        modal.setAttribute('aria-hidden', 'false');
      }
    }

    function closeMonthlyLetter() {
      const modal = document.getElementById('monthlyLetterModal');
      if (modal) {
        modal.classList.remove('visible');
        modal.setAttribute('aria-hidden', 'true');
      }
    }

    async function saveReflectionSource({ reflectionId, sourceType, sourceText, noteId = null, voiceTranscriptId = null }) {
      if (!currentUser?.id || !reflectionId || !sourceText) return;

      const { error } = await supabaseClient
        .from('journey_reflection_sources')
        .insert([{
          user_id: currentUser.id,
          reflection_id: Number(reflectionId),
          source_type: sourceType,
          source_text: sourceText,
          note_id: noteId,
          voice_transcript_id: voiceTranscriptId,
          session_id: sessionId
        }]);

      if (error) console.error('save reflection source error:', error);
    }

    async function saveNote(noteForm, sourceType = 'note') {
      if (!currentUser?.id) {
        alert('Please log in first so CalmNow can keep your Journey safely.');
        return;
      }

      const reflectionId = noteForm.dataset.reflectionId;
      const textarea = noteForm.querySelector('textarea');
      const status = noteForm.querySelector('.note-status');
      const saveBtn = noteForm.querySelector('.note-save-btn');
      const text = (textarea?.value || '').trim();

      if (!text) return;
      if (status) status.textContent = 'saving...';
      if (saveBtn) saveBtn.disabled = true;

      const notePayload = {
        user_id: currentUser.id,
        reflection_id: Number(reflectionId),
        note_text: text,
        source_type: sourceType,
        session_id: sessionId,
        updated_at: new Date().toISOString()
      };

      const { data: note, error } = await supabaseClient
        .from('journey_notes')
        .insert([notePayload])
        .select('id, reflection_id, note_text, voice_transcript, created_at, updated_at')
        .single();

      if (saveBtn) saveBtn.disabled = false;

      if (error) {
        console.error('save note error:', error);
        if (status) status.textContent = 'could not save yet';
        return;
      }

      if (!reflectionNotesById[reflectionId]) reflectionNotesById[reflectionId] = [];
      reflectionNotesById[reflectionId].unshift(note);

      window.calmTrack?.('Journey Note Saved');

      await saveReflectionSource({ reflectionId, sourceType, sourceText: text, noteId: note.id });

      const savedWrap = document.querySelector(`[data-saved-notes="${reflectionId}"]`);
      if (savedWrap) savedWrap.innerHTML = renderSavedNotes(reflectionId);

      textarea.value = '';
      noteForm.classList.remove('visible');
      if (status) status.textContent = 'saved softly';
      setTimeout(() => { if (status) status.textContent = ''; }, 1800);
    }

    function findNoteById(noteId) {
      const id = Number(noteId);
      for (const notes of Object.values(reflectionNotesById)) {
        const found = (notes || []).find(note => Number(note.id) === id);
        if (found) return found;
      }
      return null;
    }

    function setNoteEditMode(noteId, isEditing) {
      const noteCard = document.querySelector(`[data-note-id="${noteId}"]`);
      if (!noteCard) return;

      const textEl = noteCard.querySelector(`[data-note-text="${noteId}"]`);
      const actionsEl = noteCard.querySelector(`[data-note-view-actions="${noteId}"]`);
      const formEl = noteCard.querySelector(`[data-note-edit-form="${noteId}"]`);
      const inputEl = noteCard.querySelector(`[data-note-edit-input="${noteId}"]`);
      const note = findNoteById(noteId);

      if (inputEl && note) inputEl.value = note.note_text || note.voice_transcript || '';
      if (textEl) textEl.style.display = isEditing ? 'none' : 'block';
      if (actionsEl) actionsEl.style.display = isEditing ? 'none' : 'flex';
      if (formEl) formEl.classList.toggle('visible', isEditing);
      if (isEditing && inputEl) inputEl.focus();
    }

    async function updateNote(noteCard) {
      if (!currentUser?.id) return;

      const noteId = Number(noteCard?.dataset.noteId);
      const reflectionId = Number(noteCard?.dataset.noteReflectionId);
      const input = noteCard.querySelector(`[data-note-edit-input="${noteId}"]`);
      const text = (input?.value || '').trim();
      if (!noteId || !reflectionId || !text) return;

      const saveBtn = noteCard.querySelector(`[data-save-note-edit="${noteId}"]`);
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
      }

      const { data: updatedNote, error } = await supabaseClient
        .from('journey_notes')
        .update({ note_text: text, updated_at: new Date().toISOString() })
        .eq('id', noteId)
        .eq('user_id', currentUser.id)
        .select('id, reflection_id, note_text, voice_transcript, created_at, updated_at')
        .single();

      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
      }

      if (error) {
        console.error('update note error:', error);
        alert('Could not update this note yet.');
        return;
      }

      const notes = reflectionNotesById[reflectionId] || [];
      const idx = notes.findIndex(note => Number(note.id) === noteId);
      if (idx >= 0) notes[idx] = updatedNote;
      reflectionNotesById[reflectionId] = notes;

      await supabaseClient
        .from('journey_reflection_sources')
        .update({ source_text: text })
        .eq('note_id', noteId)
        .eq('user_id', currentUser.id);

      const savedWrap = document.querySelector(`[data-saved-notes="${reflectionId}"]`);
      if (savedWrap) savedWrap.innerHTML = renderSavedNotes(reflectionId);
    }

    async function deleteNote(noteId, reflectionId) {
      if (!currentUser?.id || !noteId || !reflectionId) return;
      const ok = confirm('Delete this note?');
      if (!ok) return;

      const { error } = await supabaseClient
        .from('journey_notes')
        .delete()
        .eq('id', Number(noteId))
        .eq('user_id', currentUser.id);

      if (error) {
        console.error('delete note error:', error);
        alert('Could not delete this note yet.');
        return;
      }

      if (reflectionNotesById[reflectionId]) {
        reflectionNotesById[reflectionId] = reflectionNotesById[reflectionId].filter(note => Number(note.id) !== Number(noteId));
      }

      await supabaseClient
        .from('journey_reflection_sources')
        .delete()
        .eq('note_id', Number(noteId))
        .eq('user_id', currentUser.id);

      const savedWrap = document.querySelector(`[data-saved-notes="${reflectionId}"]`);
      if (savedWrap) savedWrap.innerHTML = renderSavedNotes(reflectionId);
    }

    async function saveVoiceTranscript(noteForm, transcript) {
      if (!currentUser?.id || !transcript?.trim()) return;
      const reflectionId = Number(noteForm.dataset.reflectionId);

      const { data: voiceRow, error } = await supabaseClient
        .from('journey_voice_transcripts')
        .insert([{
          user_id: currentUser.id,
          reflection_id: reflectionId,
          transcript: transcript.trim(),
          session_id: sessionId,
          language: navigator.language || 'en-US'
        }])
        .select('id')
        .single();

      if (error) {
        console.error('save voice transcript error:', error);
        return null;
      }

      await saveReflectionSource({
        reflectionId,
        sourceType: 'voice_transcript',
        sourceText: transcript.trim(),
        voiceTranscriptId: voiceRow.id
      });

      return voiceRow;
    }

    function startVoiceNote(noteForm, btn) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const textarea = noteForm.querySelector('textarea');
      const status = noteForm.querySelector('.note-status');

      if (!SpeechRecognition) {
        if (status) status.textContent = 'voice is not supported on this browser';
        return;
      }

      if (activeRecognition) {
        activeRecognition.stop();
        activeRecognition = null;
        return;
      }

      let finalTranscript = '';
      const recognition = new SpeechRecognition();
      activeRecognition = recognition;
      recognition.lang = navigator.language || 'en-US';
      recognition.interimResults = true;
      recognition.continuous = false;

      btn.classList.add('listening');
      btn.textContent = 'listening...';
      if (status) status.textContent = 'speak softly';

      recognition.onresult = event => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const chunk = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += chunk;
          else interim += chunk;
        }
        textarea.value = `${finalTranscript}${interim}`.trim();
      };

      recognition.onerror = err => {
        console.error('voice recognition error:', err);
        if (status) status.textContent = 'voice stopped';
      };

      recognition.onend = async () => {
        btn.classList.remove('listening');
        btn.textContent = '🎙 Voice';
        activeRecognition = null;
        const transcript = (textarea.value || '').trim();
        if (transcript) {
          await saveVoiceTranscript(noteForm, transcript);
          if (status) status.textContent = 'voice transcript saved';
        } else if (status) {
          status.textContent = '';
        }
      };

      recognition.start();
    }


    function closeNoteForm(noteForm, clearText = false) {
      if (!noteForm) return;
      const textarea = noteForm.querySelector('textarea');
      const status = noteForm.querySelector('.note-status');
      if (clearText && textarea) textarea.value = '';
      if (status) status.textContent = '';
      noteForm.classList.remove('visible');
    }

    document.getElementById('prev-btn').onclick = () => goTo(currentPage - 1);
    document.getElementById('next-btn').onclick = () => goTo(currentPage + 1);

    const mobilePrevMonth = document.getElementById('mobile-prev-month');
    const mobileNextMonth = document.getElementById('mobile-next-month');

    if (mobilePrevMonth) {
      mobilePrevMonth.onclick = async () => {
        if (selectedMonth === 0) { selectedMonth = 11; selectedYear -= 1; }
        else selectedMonth -= 1;
        currentPage = 0;
        await loadJourneyData();
      };
    }

    if (mobileNextMonth) {
      mobileNextMonth.onclick = async () => {
        if (selectedMonth === 11) { selectedMonth = 0; selectedYear += 1; }
        else selectedMonth += 1;
        currentPage = 0;
        await loadJourneyData();
      };
    }

    let startX = 0, isDragging = false;
    const wrapper = document.getElementById('strip-wrapper');
    wrapper.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isDragging = true; });
    wrapper.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      const diff = e.changedTouches[0].clientX - startX;
      if (Math.abs(diff) > 40) goTo(currentPage + (diff < 0 ? 1 : -1));
    });
    wrapper.addEventListener('mousedown', e => { startX = e.clientX; isDragging = true; });
    wrapper.addEventListener('mouseup', e => {
      if (!isDragging) return;
      isDragging = false;
      const diff = e.clientX - startX;
      if (Math.abs(diff) > 40) goTo(currentPage + (diff < 0 ? 1 : -1));
    });

    document.getElementById('page-strip').addEventListener('click', async e => {
      const monthlyLetterTrigger = e.target.closest('[data-open-monthly-letter]');
      if (monthlyLetterTrigger) {
        openMonthlyLetter();
        return;
      }

      const editNoteBtn = e.target.closest('[data-edit-note]');
      if (editNoteBtn) {
        setNoteEditMode(editNoteBtn.dataset.editNote, true);
        return;
      }

      const cancelNoteEditBtn = e.target.closest('[data-cancel-note-edit]');
      if (cancelNoteEditBtn) {
        setNoteEditMode(cancelNoteEditBtn.dataset.cancelNoteEdit, false);
        return;
      }

      const deleteNoteBtn = e.target.closest('[data-delete-note]');
      if (deleteNoteBtn) {
        const noteCard = deleteNoteBtn.closest('[data-note-id]');
        await deleteNote(deleteNoteBtn.dataset.deleteNote, noteCard?.dataset.noteReflectionId);
        return;
      }

      const noteTrigger = e.target.closest('[data-trigger]');
      if (noteTrigger) {
        const id = noteTrigger.dataset.trigger;
        const form = document.querySelector(`[data-form="${id}"]`);
        if (form) {
          const willOpen = !form.classList.contains('visible');
          if (!willOpen) {
            closeNoteForm(form, false);
            return;
          }
          form.classList.add('visible');
          const status = form.querySelector('.note-status');
          if (status) status.textContent = '';
          const textarea = form.querySelector('textarea');
          if (textarea) textarea.focus();
        }
        return;
      }

      const cancelNoteBtn = e.target.closest('[data-cancel-note-form]');
      if (cancelNoteBtn) {
        const noteForm = cancelNoteBtn.closest('.note-form');
        closeNoteForm(noteForm, false);
        return;
      }

      const voiceBtn = e.target.closest('[data-voice-btn]');
      if (voiceBtn) {
        const noteForm = voiceBtn.closest('.note-form');
        if (noteForm) startVoiceNote(noteForm, voiceBtn);
        return;
      }
    });

    document.getElementById('page-strip').addEventListener('submit', async e => {
      const editForm = e.target.closest('.note-edit-form');
      if (editForm) {
        e.preventDefault();
        const noteCard = editForm.closest('[data-note-id]');
        if (noteCard) await updateNote(noteCard);
        return;
      }

      const noteForm = e.target.closest('.note-form');
      if (!noteForm) return;
      e.preventDefault();
      await saveNote(noteForm, 'note');
    });

    window.addEventListener('resize', positionStrip);

    const monthlyLetterModal = document.getElementById('monthlyLetterModal');
    const monthlyLetterClose = document.getElementById('monthlyLetterClose');

    if (monthlyLetterClose) monthlyLetterClose.addEventListener('click', closeMonthlyLetter);
    if (monthlyLetterModal) {
      monthlyLetterModal.addEventListener('click', e => {
        if (e.target === monthlyLetterModal) closeMonthlyLetter();
      });
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMonthlyLetter();
    });

    (async function initJourneyPage() {
      await initAuth();
      await loadJourneyData();
    })();
  </script></body>
</html>
